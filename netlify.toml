[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  external_node_modules = ["nodemailer"]
  included_files = ["shared/fonts/*.ttf"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; connect-src 'self' ws: wss: https://*.netlify.com https://*.netlify.app https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://*.netlify.app"

# SPA fallback. Function paths take precedence over this rewrite.
# Admin pages are locked in the app and in the functions, not by CDN 302s —
# those redirects were serving the stale publish folder under `netlify dev`.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
