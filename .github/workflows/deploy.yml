name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@da0e0e6eb477dfe3f8b964b085b3e8f0fc718e5c # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply markaz --remote

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_HOST: thesalafimindset.com
          VITE_ADMIN_HOST: admin.mysalafimindset.com
          VITE_PUBLIC_ORIGIN: https://thesalafimindset.com
          VITE_ADMIN_ORIGIN: https://admin.mysalafimindset.com

      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0e6eb477dfe3f8b964b085b3e8f0fc718e5c # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
